plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.alxad.demo'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.alxad.demo"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        config {
            keyAlias 'alxsdk'
            keyPassword 'alxsdk'
            storeFile file('alxsdk.jks')
            storePassword 'alxsdk'
        }
    }

    buildTypes {
        debug{
            minifyEnabled false
            signingConfig signingConfigs.config
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.config
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.multidex
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.core.ktx

    implementation 'com.github.bumptech.glide:glide:5.0.5'

    //alx ad
    implementation 'io.github.algorixco:ads-sdk:3.9.4'

    //admob 平台
    implementation "com.google.android.gms:play-services-ads:23.5.0"

    //topon 平台
    implementation "com.anythink.sdk:core-tpn:6.4.39"
    implementation "com.anythink.sdk:nativead-tpn:6.4.39"
    implementation "com.anythink.sdk:banner-tpn:6.4.39"
    implementation "com.anythink.sdk:interstitial-tpn:6.4.39"
    implementation "com.anythink.sdk:rewardedvideo-tpn:6.4.39"
    implementation "com.anythink.sdk:splash-tpn:6.4.39"
    //Androidx (Necessary)
//    implementation "androidx.appcompat:appcompat:1.4.1"
    implementation "androidx.browser:browser:1.4.0"
//    implementation "com.google.android.gms:play-services-ads:23.5.0" //上面已经有
    // end

    //max 平台
    implementation "com.applovin:applovin-sdk:13.3.1"

    //IronSource平台
    implementation "com.ironsource.sdk:mediationsdk:7.3.0.1"
    implementation 'com.google.android.gms:play-services-ads-identifier:18.0.1'
    //end

    //tradplus平台
    //补充插件的引入，否则会集成失败
    //noinspection GradleCompatible
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
//    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation "com.tradplusad:tradplus:14.5.0.1"
    //end


    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
}